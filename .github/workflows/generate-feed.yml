name: Generate Zoho Commerce Feed

on:
  schedule:
    # Runs twice a day, 06:00 and 18:00 UTC. Edit the cron expression to change frequency.
    - cron: '0 6,18 * * *'
  workflow_dispatch: {}  # lets you also trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed
        env:
          PYTHONUNBUFFERED: "1"
          ZOHO_DC: ${{ secrets.ZOHO_DC }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORG_ID: ${{ secrets.ZOHO_ORG_ID }}
        run: python -u scripts/generate_feed.py

      - name: Commit updated feed if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/categories.json docs/products.json
          git diff --staged --quiet || git commit -m "Update category/product feed"
          git push
